<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareerCopilot — Sign In</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">✦</div>
      <h1>CareerCopilot</h1>
      <p>Your AI-powered job search assistant</p>
    </div>

    <!-- ── Sign In form ── -->
    <form class="login-form" id="signInForm">
      <div class="input-group">
        <label for="siEmail">Email</label>
        <input type="email" id="siEmail" placeholder="you@example.com" required autocomplete="email" />
      </div>
      <div class="input-group">
        <label for="siPassword">Password</label>
        <input type="password" id="siPassword" placeholder="••••••••" required autocomplete="current-password" />
      </div>

      <p class="error-msg" id="signInError"></p>

      <button type="submit" class="btn btn-gold" id="signInBtn">Sign In</button>

      <div class="auth-or-divider"><span>or</span></div>

      <button type="button" class="btn btn-google" id="googleSignInBtn">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.64 9.2045C17.64 8.5663 17.5827 7.9527 17.4764 7.3636H9V10.845H13.8436C13.635 11.97 13.0009 12.9231 12.0477 13.5613V15.8195H14.9564C16.6582 14.2527 17.64 11.9454 17.64 9.2045Z" fill="#4285F4"/>
          <path d="M9 18C11.43 18 13.4673 17.1941 14.9564 15.8195L12.0477 13.5613C11.2418 14.1013 10.2109 14.4204 9 14.4204C6.65591 14.4204 4.67182 12.8372 3.96409 10.71H0.957275V13.0418C2.43818 15.9831 5.48182 18 9 18Z" fill="#34A853"/>
          <path d="M3.96409 10.71C3.78409 10.17 3.68182 9.5931 3.68182 9C3.68182 8.4068 3.78409 7.83 3.96409 7.29V4.9581H0.957275C0.347727 6.1731 0 7.5477 0 9C0 10.4522 0.347727 11.8268 0.957275 13.0418L3.96409 10.71Z" fill="#FBBC05"/>
          <path d="M9 3.5795C10.3214 3.5795 11.5077 4.0336 12.4405 4.9254L15.0218 2.344C13.4632 0.8918 11.4259 0 9 0C5.48182 0 2.43818 2.0168 0.957275 4.9581L3.96409 7.29C4.67182 5.1627 6.65591 3.5795 9 3.5795Z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <p class="auth-switch">Don't have an account? <a href="#" id="toSignUp">Sign up</a></p>
    </form>

    <!-- ── Sign Up form ── -->
    <form class="login-form" id="signUpForm" style="display:none">
      <div class="input-group">
        <label for="suEmail">Email</label>
        <input type="email" id="suEmail" placeholder="you@example.com" required autocomplete="email" />
      </div>
      <div class="input-group">
        <label for="suPassword">Password</label>
        <input type="password" id="suPassword" placeholder="At least 6 characters" required autocomplete="new-password" />
      </div>
      <div class="input-group">
        <label for="suConfirm">Confirm Password</label>
        <input type="password" id="suConfirm" placeholder="••••••••" required autocomplete="new-password" />
      </div>

      <p class="error-msg" id="signUpError"></p>

      <div class="tos-agree">
        <label class="tos-check-label">
          <input type="checkbox" id="suTosCheck" />
          <span>I agree to the <a href="terms.html" target="_blank">Terms of Service</a> and <a href="privacy.html" target="_blank">Privacy Policy</a></span>
        </label>
      </div>

      <button type="submit" class="btn btn-gold" id="signUpBtn">Create Account</button>

      <div class="auth-or-divider"><span>or</span></div>

      <button type="button" class="btn btn-google" id="googleSignUpBtn">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.64 9.2045C17.64 8.5663 17.5827 7.9527 17.4764 7.3636H9V10.845H13.8436C13.635 11.97 13.0009 12.9231 12.0477 13.5613V15.8195H14.9564C16.6582 14.2527 17.64 11.9454 17.64 9.2045Z" fill="#4285F4"/>
          <path d="M9 18C11.43 18 13.4673 17.1941 14.9564 15.8195L12.0477 13.5613C11.2418 14.1013 10.2109 14.4204 9 14.4204C6.65591 14.4204 4.67182 12.8372 3.96409 10.71H0.957275V13.0418C2.43818 15.9831 5.48182 18 9 18Z" fill="#34A853"/>
          <path d="M3.96409 10.71C3.78409 10.17 3.68182 9.5931 3.68182 9C3.68182 8.4068 3.78409 7.83 3.96409 7.29V4.9581H0.957275C0.347727 6.1731 0 7.5477 0 9C0 10.4522 0.347727 11.8268 0.957275 13.0418L3.96409 10.71Z" fill="#FBBC05"/>
          <path d="M9 3.5795C10.3214 3.5795 11.5077 4.0336 12.4405 4.9254L15.0218 2.344C13.4632 0.8918 11.4259 0 9 0C5.48182 0 2.43818 2.0168 0.957275 4.9581L3.96409 7.29C4.67182 5.1627 6.65591 3.5795 9 3.5795Z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </button>

      <p class="auth-switch">Already have an account? <a href="#" id="toSignIn">Sign in</a></p>
    </form>

  </div>

  <!-- ── ToS acceptance modal (shown when a NEW user signs in via Google on the sign-in tab) ── -->
  <div id="tosOverlay" class="tos-overlay" aria-modal="true" role="dialog" aria-labelledby="tosModalTitle" style="display:none">
    <div class="tos-modal-card">
      <div class="tos-modal-icon">✦</div>
      <h2 class="tos-modal-title" id="tosModalTitle">One Last Step</h2>
      <p class="tos-modal-body">
        It looks like this is your first time signing in. Before we create your account, please read and agree to our terms.
      </p>
      <div class="tos-agree" style="margin-bottom:0">
        <label class="tos-check-label">
          <input type="checkbox" id="tosModalCheck" />
          <span>I agree to the <a href="terms.html" target="_blank">Terms of Service</a> and <a href="privacy.html" target="_blank">Privacy Policy</a></span>
        </label>
      </div>
      <p class="error-msg" id="tosModalError" style="min-height:18px;margin-top:6px"></p>
      <div class="tos-modal-actions">
        <button class="btn btn-gold" id="tosModalAccept">Continue →</button>
        <button class="btn btn-ghost" id="tosModalCancel">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Firebase compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // ── Toggle between sign-in and sign-up ──────────────────────────────────
    document.getElementById("toSignUp").addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("signInForm").style.display = "none";
      document.getElementById("signUpForm").style.display = "";
      document.getElementById("signUpError").textContent  = "";
    });
    document.getElementById("toSignIn").addEventListener("click", (e) => {
      e.preventDefault();
      document.getElementById("signUpForm").style.display = "none";
      document.getElementById("signInForm").style.display = "";
      document.getElementById("signInError").textContent  = "";
    });

    // ── Shared: store session and redirect ───────────────────────────────────
    async function onAuthSuccess(user) {
      const token = await user.getIdToken();
      sessionStorage.setItem("fbToken", token);
      sessionStorage.setItem("fbEmail", user.email);
      window.location.href = "dashboard.html";
    }

    // ── ToS checkbox helper ──────────────────────────────────────────────────
    function tosChecked() {
      return document.getElementById("suTosCheck").checked;
    }
    function requireTos(errorElId) {
      if (!tosChecked()) {
        document.getElementById(errorElId).textContent =
          "You must agree to the Terms of Service and Privacy Policy to continue.";
        document.getElementById("suTosCheck").closest(".tos-agree").classList.add("tos-shake");
        setTimeout(() =>
          document.getElementById("suTosCheck").closest(".tos-agree").classList.remove("tos-shake"), 500);
        return false;
      }
      return true;
    }

    // ── ToS modal (shown when a new user signs up via the sign-in tab Google button) ──
    function showTosModal() {
      return new Promise((resolve) => {
        const overlay   = document.getElementById("tosOverlay");
        const checkEl   = document.getElementById("tosModalCheck");
        const errorEl   = document.getElementById("tosModalError");
        const acceptBtn = document.getElementById("tosModalAccept");
        const cancelBtn = document.getElementById("tosModalCancel");

        // Reset state
        checkEl.checked     = false;
        errorEl.textContent = "";
        overlay.style.display = "flex";

        acceptBtn.onclick = () => {
          if (!checkEl.checked) {
            errorEl.textContent = "Please check the box above to continue.";
            return;
          }
          overlay.style.display = "none";
          resolve(true);
        };
        cancelBtn.onclick = () => {
          overlay.style.display = "none";
          resolve(false);
        };
      });
    }

    // ── Sign In (email/password — no ToS required, already agreed at signup) ─
    document.getElementById("signInForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("signInError");
      const btn     = document.getElementById("signInBtn");
      errorEl.textContent = "";
      btn.disabled    = true;
      btn.textContent = "Signing in…";
      const email    = document.getElementById("siEmail").value.trim();
      const password = document.getElementById("siPassword").value;
      try {
        const cred = await auth.signInWithEmailAndPassword(email, password);
        await onAuthSuccess(cred.user);
      } catch (err) {
        errorEl.textContent = friendlyError(err.code);
        btn.disabled    = false;
        btn.textContent = "Sign In";
      }
    });

    // ── Sign Up (email/password — ToS checkbox required) ────────────────────
    document.getElementById("signUpForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById("signUpError");
      const btn     = document.getElementById("signUpBtn");
      errorEl.textContent = "";

      if (!requireTos("signUpError")) return;

      const email    = document.getElementById("suEmail").value.trim();
      const password = document.getElementById("suPassword").value;
      const confirm  = document.getElementById("suConfirm").value;
      if (password !== confirm) {
        errorEl.textContent = "Passwords do not match.";
        return;
      }
      if (password.length < 6) {
        errorEl.textContent = "Password must be at least 6 characters.";
        return;
      }
      btn.disabled    = true;
      btn.textContent = "Creating account…";
      try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        await onAuthSuccess(cred.user);
      } catch (err) {
        errorEl.textContent = friendlyError(err.code);
        btn.disabled    = false;
        btn.textContent = "Create Account";
      }
    });

    // ── Google — sign-up tab (ToS checkbox required before OAuth fires) ──────
    document.getElementById("googleSignUpBtn").addEventListener("click", async () => {
      if (!requireTos("signUpError")) return;
      await googleOAuth(false);
    });

    // ── Google — sign-in tab (ToS modal shown only if the account is new) ────
    document.getElementById("googleSignInBtn").addEventListener("click", () => googleOAuth(true));

    async function googleOAuth(isSignInTab) {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        const cred = await auth.signInWithPopup(provider);

        const isNew = cred.additionalUserInfo && cred.additionalUserInfo.isNewUser;
        if (isSignInTab && isNew) {
          // New account created from the sign-in tab — need explicit ToS agreement
          const agreed = await showTosModal();
          if (!agreed) {
            // User declined — remove the account Firebase just created
            await cred.user.delete();
            document.getElementById("signInError").textContent =
              "Account creation cancelled. You must agree to the Terms of Service to use CareerCopilot.";
            return;
          }
        }

        await onAuthSuccess(cred.user);
      } catch (err) {
        if (err.code !== "auth/popup-closed-by-user") {
          document.getElementById("signInError").textContent = friendlyError(err.code);
          document.getElementById("signUpError").textContent = friendlyError(err.code);
        }
      }
    }

    // ── Error messages ───────────────────────────────────────────────────────
    function friendlyError(code) {
      const map = {
        "auth/invalid-credential":       "Invalid email or password.",
        "auth/user-not-found":           "No account found with that email.",
        "auth/wrong-password":           "Incorrect password.",
        "auth/too-many-requests":        "Too many attempts. Try again later.",
        "auth/network-request-failed":   "Network error. Check your connection.",
        "auth/invalid-email":            "Please enter a valid email address.",
        "auth/email-already-in-use":     "An account with this email already exists.",
        "auth/weak-password":            "Password is too weak. Use at least 6 characters.",
        "auth/popup-blocked":            "Popup was blocked. Please allow popups and try again.",
        "auth/account-exists-with-different-credential":
                                         "An account already exists with this email. Try signing in with email/password.",
      };
      return map[code] ?? `Authentication failed (${code}). Please try again.`;
    }
  </script>

</body>
</html>
